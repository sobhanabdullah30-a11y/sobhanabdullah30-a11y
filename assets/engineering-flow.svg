<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Full-stack engineering flow</title>
  <desc id="desc">Animated requests travel from a React interface through an ASP.NET Core API and service layer to SQL Server.</desc>
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#12102a"/></linearGradient>
    <linearGradient id="flowLine"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <filter id="flowGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.label{fill:#94a3b8;font-size:12px;font-weight:700;letter-spacing:1.4px}.name{fill:#f8fafc;font-size:18px;font-weight:800}.detail{fill:#94a3b8;font-size:12px}.node{animation:nodePulse 3s ease-in-out infinite}.n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}
      @keyframes nodePulse{0%,100%{opacity:.82}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#flowBg)"/>
  <text x="48" y="43" class="sans label">HOW I ENGINEER A PRODUCT</text>
  <path id="route" d="M226 137 H394 M506 137 H674 M786 137 H954" stroke="url(#flowLine)" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <g fill="#38bdf8" filter="url(#flowGlow)">
    <circle r="5"><animateMotion dur="3s" repeatCount="indefinite" path="M226 137 H394"/></circle>
    <circle r="5"><animateMotion begin=".7s" dur="3s" repeatCount="indefinite" path="M506 137 H674"/></circle>
    <circle r="5"><animateMotion begin="1.4s" dur="3s" repeatCount="indefinite" path="M786 137 H954"/></circle>
  </g>
  <g class="sans node">
    <rect x="48" y="79" width="178" height="116" rx="18" fill="#17152c" stroke="#8b5cf6"/>
    <rect x="67" y="98" width="40" height="32" rx="7" fill="#8b5cf6" opacity=".18"/><path d="M77 107h20v14H77zM80 110h14" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <text x="67" y="153" class="label">INTERFACE</text><text x="67" y="177" class="name">React + Vite</text>
  </g>
  <g class="sans node n2">
    <rect x="394" y="79" width="112" height="116" rx="18" fill="#111b2d" stroke="#38bdf8"/>
    <text x="414" y="118" class="label">API</text><text x="414" y="147" class="name">.NET 8</text><text x="414" y="169" class="detail">REST + JWT</text>
  </g>
  <g class="sans node n3">
    <rect x="674" y="79" width="112" height="116" rx="18" fill="#111b2d" stroke="#38bdf8"/>
    <text x="694" y="118" class="label">LOGIC</text><text x="694" y="147" class="name">Services</text><text x="694" y="169" class="detail">Clean layers</text>
  </g>
  <g class="sans node n4">
    <rect x="954" y="79" width="198" height="116" rx="18" fill="#10251f" stroke="#34d399"/>
    <ellipse cx="986" cy="110" rx="14" ry="6" fill="none" stroke="#34d399" stroke-width="2"/><path d="M972 110v17c0 8 28 8 28 0v-17M972 119c0 8 28 8 28 0" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="1014" y="119" class="label">DATA</text><text x="974" y="160" class="name">SQL Server</text><text x="974" y="181" class="detail">EF Core persistence</text>
  </g>
  <text x="600" y="226" text-anchor="middle" class="sans detail">DESIGN → BUILD → VERIFY → DEPLOY → IMPROVE</text>
</svg>
