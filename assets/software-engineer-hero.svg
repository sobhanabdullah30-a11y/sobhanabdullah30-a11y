<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Subhan Abdullah — Full-Stack Software Engineer</title>
  <desc id="desc">An animated software engineering workspace with code, API and database cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090f"/>
      <stop offset="0.55" stop-color="#111025"/>
      <stop offset="1" stop-color="#090d19"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
      <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panel"><rect x="648" y="62" width="484" height="316" rx="18"/></clipPath>
    <style>
      .sans{font-family:Inter,Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,Monaco,monospace}
      .muted{fill:#94a3b8}.white{fill:#f8fafc}.violet{fill:#a78bfa}.blue{fill:#38bdf8}.green{fill:#34d399}
      .float-a{animation:floatA 4s ease-in-out infinite}.float-b{animation:floatB 5s ease-in-out infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.blink{animation:blink 1s steps(1) infinite}
      .line1{animation:reveal 8s ease-in-out infinite}.line2{animation:reveal 8s .35s ease-in-out infinite}.line3{animation:reveal 8s .7s ease-in-out infinite}.line4{animation:reveal 8s 1.05s ease-in-out infinite}.line5{animation:reveal 8s 1.4s ease-in-out infinite}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(9px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:0}}
      @keyframes reveal{0%,8%{opacity:0;transform:translateX(-8px)}16%,84%{opacity:1;transform:translateX(0)}94%,100%{opacity:0}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="437" rx="26.5" fill="none" stroke="url(#accent)" stroke-width="3"/>
  <circle cx="1030" cy="54" r="110" fill="#7c3aed" opacity=".08" filter="url(#glow)"/>
  <circle cx="220" cy="410" r="145" fill="#0ea5e9" opacity=".06" filter="url(#glow)"/>

  <g class="sans">
    <g transform="translate(68 70)">
      <rect width="176" height="32" rx="16" fill="#ffffff" opacity=".06" stroke="#a78bfa" stroke-opacity=".45"/>
      <circle cx="18" cy="16" r="5" fill="#34d399" class="pulse"/>
      <text x="32" y="21" font-size="12" font-weight="700" letter-spacing="1.5" class="green">AVAILABLE TO BUILD</text>
    </g>
    <text x="68" y="157" font-size="18" font-weight="700" letter-spacing="3" class="violet">HELLO, I'M</text>
    <text x="68" y="219" font-size="51" font-weight="800" class="white">Subhan Abdullah</text>
    <text x="68" y="263" font-size="23" font-weight="600" class="blue">Full-Stack Software Engineer</text>
    <text x="68" y="305" font-size="16" class="muted">I design secure APIs, thoughtful data models and</text>
    <text x="68" y="330" font-size="16" class="muted">polished interfaces that are ready for production.</text>
    <g transform="translate(68 360)">
      <rect width="122" height="35" rx="10" fill="#7c3aed" opacity=".18" stroke="#8b5cf6"/>
      <text x="61" y="23" text-anchor="middle" font-size="13" font-weight="700" class="violet">ASP.NET CORE</text>
      <rect x="134" width="80" height="35" rx="10" fill="#0284c7" opacity=".18" stroke="#38bdf8"/>
      <text x="174" y="23" text-anchor="middle" font-size="13" font-weight="700" class="blue">REACT</text>
      <rect x="226" width="102" height="35" rx="10" fill="#059669" opacity=".16" stroke="#34d399"/>
      <text x="277" y="23" text-anchor="middle" font-size="13" font-weight="700" class="green">SQL SERVER</text>
    </g>
  </g>

  <g clip-path="url(#panel)">
    <rect x="648" y="62" width="484" height="316" rx="18" fill="#0b1020" stroke="#334155"/>
    <rect x="648" y="62" width="484" height="48" fill="#151b2d"/>
    <circle cx="674" cy="86" r="5" fill="#fb7185"/><circle cx="693" cy="86" r="5" fill="#fbbf24"/><circle cx="712" cy="86" r="5" fill="#34d399"/>
    <text x="748" y="91" font-size="13" class="mono muted">FanHubController.cs</text>
    <g class="mono" font-size="14">
      <text x="679" y="144" class="line1"><tspan class="violet">public async</tspan><tspan class="white"> Task&lt;ActionResult&gt; Discover()</tspan></text>
      <text x="679" y="176" class="line2"><tspan class="white">{</tspan></text>
      <text x="703" y="208" class="line3"><tspan class="violet">var</tspan><tspan class="white"> universe = </tspan><tspan class="blue">await</tspan><tspan class="white"> service.LoadAsync();</tspan></text>
      <text x="703" y="240" class="line4"><tspan class="violet">return</tspan><tspan class="green"> Ok</tspan><tspan class="white">(universe);</tspan></text>
      <text x="679" y="272" class="line5"><tspan class="white">}</tspan></text>
      <text x="679" y="330" class="green">✓ build succeeded</text><rect x="822" y="315" width="8" height="19" rx="1" class="blink" fill="#34d399"/>
    </g>
  </g>

  <g transform="translate(1018 34)"><g class="float-a sans">
    <rect width="124" height="54" rx="14" fill="#14182a" stroke="#8b5cf6"/><circle cx="22" cy="27" r="8" fill="#8b5cf6"/>
    <text x="40" y="24" font-size="11" class="muted">FRONTEND</text><text x="40" y="39" font-size="13" font-weight="700" class="white">React 19</text>
  </g></g>
  <g transform="translate(592 334)"><g class="float-b sans">
    <rect width="132" height="58" rx="14" fill="#14182a" stroke="#38bdf8"/><circle cx="24" cy="29" r="8" fill="#38bdf8"/>
    <text x="43" y="25" font-size="11" class="muted">BACKEND</text><text x="43" y="41" font-size="13" font-weight="700" class="white">.NET 8 API</text>
  </g></g>
  <g transform="translate(1050 354)"><g class="float-a sans">
    <rect width="116" height="54" rx="14" fill="#14182a" stroke="#34d399"/><circle cx="22" cy="27" r="8" fill="#34d399"/>
    <text x="40" y="24" font-size="11" class="muted">DATA</text><text x="40" y="39" font-size="13" font-weight="700" class="white">SQL Server</text>
  </g></g>
</svg>
